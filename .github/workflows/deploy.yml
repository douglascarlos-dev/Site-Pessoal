name: Deploy Automático via Cloudflare Tunnel

on:
  push:
    branches:
      - main # Ajuste para 'master' se for o nome da sua branch principal

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar cloudflared na VM do GitHub
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

      - name: Executar deploy no Orange Pi via SSH + Cloudflare
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          proxy_cmd: "cloudflared access ssh --hostname %h"
          script: |
            cd /var/www/html/douglas
            git pull origin main
            if [ -f "composer.json" ]; then
                composer install --no-dev --optimize-autoloader
            fi